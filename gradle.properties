# AndroidX is required by every androidx.* dependency this SDK uses
# (lifecycle, security-crypto, credentials). Without this the AGP build fails
# with "This project uses AndroidX dependencies, but the 'android.useAndroidX'
# property is not enabled."
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
